name: AppImage
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev librsvg2-bin librsvg2-common zsync adwaita-icon-theme libglib2.0-bin
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
      - name: Set up Rust
        run: rustup update stable
      - name: Build updateable AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Deskforge-x86_64.AppImage.zsync
        run: |
          export PATH="/tmp:$PATH"
          ./build-appimage.sh
          test -s dist/Deskforge-x86_64.AppImage.zsync
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "${RUNNER_TEMP}/deskforge-release.md"
          test -s "${RUNNER_TEMP}/deskforge-release.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "${RUNNER_TEMP}/deskforge-release.md" --title "Deskforge ${GITHUB_REF_NAME}" --latest dist/Deskforge-x86_64.AppImage dist/Deskforge-x86_64.AppImage.zsync
